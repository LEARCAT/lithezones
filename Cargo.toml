[package]
name = "lithezones"
version = "0.5.58"
edition = "2021"
description = "LitheZones（轻格分窗）— Deepin X11 轻量窗口布局工具"

[[bin]]
name = "lithezones"
path = "src/main.rs"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
enumflags2 = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x11rb = "0.13"
anyhow = "1"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
